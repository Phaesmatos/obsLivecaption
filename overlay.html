<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Italian captions · OBS overlay</title>
  <style>
    :root {
      /* Replace this file, or change this URL to another image in assets/. */
      --background-image: url("/assets/background.png");
      --caption-left: 10%;
      --caption-right: 2.5%;
      --caption-bottom: 3.8%;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #100d0a; }
    #scene {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(100vw, 177.6833vh); aspect-ratio: 1672 / 941;
      background-image: var(--background-image);
      background-size: 100% 100%; background-position: center;
      container-type: inline-size;
    }
    #captions {
      position: absolute; left: var(--caption-left); right: var(--caption-right);
      bottom: var(--caption-bottom);
      color: #fff; background: rgba(18, 12, 7, .35);
      padding: .2em .4em; border-radius: .12em;
      font: 600 clamp(14px, 2.1vw, 52px)/1.25 Arial, "DejaVu Sans", sans-serif;
      font-size: clamp(14px, 2.1cqw, 52px);
      text-shadow: 0 2px 3px #000; text-align: center;
      white-space: normal; overflow-wrap: anywhere;
      max-height: 2.9em; overflow: hidden;
    }
    #captions:empty { display: none; }
  </style>
</head>
<body>
  <div id="scene">
    <div id="captions" role="status" aria-live="polite"></div>
  </div>
  <script>
    const captions = document.getElementById("captions");
    let lastSuccess = performance.now();
    async function refresh() {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 1200);
      try {
        const response = await fetch("/state", {cache: "no-store", signal: controller.signal});
        if (!response.ok) throw new Error("Unavailable");
        const state = await response.json();
        captions.textContent = state.text || "";
        lastSuccess = performance.now();
      } catch (_) {
        if (performance.now() - lastSuccess > 2000) captions.textContent = "";
      } finally {
        clearTimeout(timer);
        setTimeout(refresh, 150);
      }
    }
    refresh();
  </script>
</body>
</html>
