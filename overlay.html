<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Italian captions · OBS overlay</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    body { display: flex; align-items: flex-end; justify-content: center; padding: 0 5% 4%; }
    #captions {
      color: #fff; background: rgba(8, 12, 18, .88);
      padding: .24em .5em; border-radius: .16em;
      font: 600 clamp(18px, 2.25vw, 64px)/1.3 Arial, "DejaVu Sans", sans-serif;
      text-shadow: 0 2px 3px #000; text-align: center;
      white-space: pre-line; overflow-wrap: anywhere;
      max-width: 100%; max-height: 3.15em; overflow: hidden;
    }
    #captions:empty { display: none; }
  </style>
</head>
<body>
  <div id="captions" role="status" aria-live="polite"></div>
  <script>
    const captions = document.getElementById("captions");
    let lastSuccess = performance.now();
    async function refresh() {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 1200);
      try {
        const response = await fetch("/state", {cache: "no-store", signal: controller.signal});
        if (!response.ok) throw new Error("Unavailable");
        const state = await response.json();
        captions.textContent = state.text || "";
        lastSuccess = performance.now();
      } catch (_) {
        if (performance.now() - lastSuccess > 2000) captions.textContent = "";
      } finally {
        clearTimeout(timer);
        setTimeout(refresh, 150);
      }
    }
    refresh();
  </script>
</body>
</html>
